<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Avatim · Auditoria de Padrão de Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mata:#15271F;
  --mata-2:#1E3A2C;
  --folha:#3E7A5A;
  --sage:#E7EBE2;
  --papel:#FBFBF7;
  --tinta:#141A16;
  --ocre:#C4842B;
  --terra:#A8452F;
  --cinza:#7C8079;
  --linha:#D3D8CC;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sage);
  color:var(--tinta);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:96px;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tinta)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- chrome ---------- */
header.top{background:var(--mata);color:#F3F1E9;padding:14px 0 0;position:sticky;top:0;z-index:50}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand-logo{height:26px;width:auto;display:block}
.logo-rel{height:30px;width:auto;display:block;margin:0 auto 12px}
.logo-print{height:26px;width:auto;display:block;margin-bottom:12px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9DAE9F}
.storeline{font-size:13px;color:#B9C6B8;padding:2px 0 10px;display:flex;gap:8px;flex-wrap:wrap}
.storeline b{color:#F3F1E9;font-weight:600}

/* signature: régua de blocos */
.regua{display:flex;gap:3px;padding-bottom:0}
.seg{flex:1;background:rgba(255,255,255,.11);border-radius:4px 4px 0 0;height:34px;position:relative;overflow:hidden;transition:background .2s}
.seg .fill{position:absolute;left:0;right:0;bottom:0;background:var(--folha);transition:height .35s ease}
.seg .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#F3F1E9;z-index:2}
.seg.ativo{background:rgba(255,255,255,.28)}
.seg.ativo .num{color:#fff}
.seg.alerta .fill{background:var(--terra)}
.seg.atencao .fill{background:var(--ocre)}

/* ---------- cards ---------- */
main{padding-top:20px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:18px;margin-bottom:14px}
.bloco-head{padding:6px 2px 14px}
.bloco-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--folha);font-weight:600}
.bloco-head h2{font-size:26px;margin-top:4px;line-height:1.15}
.bloco-head p{margin:6px 0 0;font-size:14px;color:var(--cinza)}

.item{border-bottom:1px solid var(--linha);padding:18px 0}
.item:first-of-type{padding-top:2px}
.item:last-child{border-bottom:none;padding-bottom:2px}
.item-code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ocre);font-weight:600}
.item-t{font-size:16.5px;font-weight:600;margin:3px 0 0;line-height:1.35}
.crit{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;vertical-align:2px;margin-left:6px;font-weight:600}
.crit.alta{background:#F6E3DE;color:var(--terra)}
.crit.media{background:#F7EBD6;color:#8A5B14}
.crit.baixa{background:#E4EBE4;color:var(--cinza)}
.dica{display:flex;gap:8px;background:#F1F4EE;border-left:3px solid var(--folha);border-radius:0 8px 8px 0;padding:9px 11px;margin:10px 0 12px;font-size:13.5px;line-height:1.45;color:#3D4A41}
.dica b{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--folha);display:block;margin-bottom:2px}

.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.opt{border:1.5px solid var(--linha);background:#fff;border-radius:10px;padding:11px 4px;font-size:13.5px;font-weight:600;text-align:center;transition:.14s;color:#5A6159}
.opt small{display:block;font-weight:400;font-size:10.5px;opacity:.7;margin-top:1px}
.opt:active{transform:scale(.97)}
.opt.on-C{background:var(--folha);border-color:var(--folha);color:#fff}
.opt.on-NC{background:var(--terra);border-color:var(--terra);color:#fff}
.opt.on-NA{background:#DFE3DC;border-color:#C7CDC3;color:#4A514A}

.extras{margin-top:11px;display:none}
.extras.show{display:block}
textarea.obs{width:100%;border:1px solid var(--linha);border-radius:10px;padding:10px;min-height:62px;resize:vertical;background:#fff;line-height:1.4}
textarea.obs:focus{outline:2px solid var(--folha);outline-offset:-1px;border-color:transparent}
.foto-bar{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.btn-foto{border:1.5px dashed #B9C0B4;border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--mata-2);background:#fff;display:inline-flex;align-items:center;gap:7px}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.thumb{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--linha)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;background:rgba(20,26,22,.8);color:#fff;border-radius:50%;width:19px;height:19px;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.aviso-foto{font-size:12.5px;color:var(--terra);font-weight:600;margin-top:7px;display:none}
.aviso-foto.show{display:block}

/* ---------- setup ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--folha);outline-offset:-1px}
.end-loja{display:none;margin-top:7px;font-size:12.5px;line-height:1.45;color:var(--cinza);background:#F1F4EE;border-left:3px solid var(--folha);border-radius:0 8px 8px 0;padding:8px 10px}
.end-loja b{color:var(--mata-2)}

/* ---------- botões ---------- */
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:12px;font-weight:600;font-size:15.5px}
.btn-p{background:var(--mata);color:#F3F1E9}
.btn-o{background:var(--ocre);color:#231703}
.btn-s{background:#fff;border:1.5px solid var(--linha);color:var(--mata)}
.btn+.btn{margin-top:9px}
.btn:disabled{opacity:.45}

.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(21,39,31,.97);backdrop-filter:blur(8px);padding:11px 16px calc(11px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:9px;align-items:center}
.navbar .status{flex:1;color:#B9C6B8;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.35}
.navbar .status b{color:#F3F1E9;display:block;font-size:13px}
.nav-btn{padding:12px 16px;border-radius:10px;font-weight:600;font-size:14.5px;background:var(--ocre);color:#231703;white-space:nowrap}
.nav-btn.ghost{background:rgba(255,255,255,.13);color:#F3F1E9}

/* ---------- relatório ---------- */
.nota-hero{background:var(--mata);color:#F3F1E9;border-radius:var(--r);padding:22px;text-align:center;margin-bottom:14px}
.nota-hero .n{font-family:'IBM Plex Mono',monospace;font-size:66px;font-weight:600;line-height:1;letter-spacing:-.03em}
.nota-hero .l{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9DAE9F;margin-bottom:8px}
.nota-hero .cls{display:inline-block;margin-top:11px;padding:5px 14px;border-radius:100px;font-size:13px;font-weight:600}
.resumo-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:15px}
.resumo-3 div{background:rgba(255,255,255,.09);border-radius:10px;padding:9px 4px}
.resumo-3 b{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px}
.resumo-3 span{font-size:10.5px;color:#9DAE9F;letter-spacing:.04em}

.barra-bloco{margin-bottom:13px}
.barra-bloco .lin{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;gap:10px}
.barra-bloco .lin b{font-family:'IBM Plex Mono',monospace;font-weight:600}
.track{height:9px;background:#E4E8DF;border-radius:100px;overflow:hidden}
.track i{display:block;height:100%;border-radius:100px}

.nc{border-left:3px solid var(--terra);background:#FCF7F5;border-radius:0 10px 10px 0;padding:13px 14px;margin-bottom:11px}
.nc .h{font-size:15px;font-weight:600;line-height:1.35}
.nc .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--terra);font-weight:600;margin-bottom:3px}
.nc .obs{font-size:13.5px;color:#4A514A;margin-top:7px;font-style:italic}
.sug{background:#EEF3EC;border-radius:9px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.45}
.sug b{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--folha);display:block;margin-bottom:3px}
.nc .thumbs img{width:100%;height:100%}
.acao-linha{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acao-linha input{width:100%;padding:9px;border:1px solid var(--linha);border-radius:8px;background:#fff;font-size:14px}
.acao-linha label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);display:block;margin-bottom:3px;font-weight:600}

table.plano{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.plano th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);border-bottom:1.5px solid var(--linha);padding:7px 6px}
table.plano td{border-bottom:1px solid var(--linha);padding:9px 6px;vertical-align:top}
.vazio{text-align:center;padding:26px 12px;color:var(--cinza);font-size:14px}
.retomar{display:none;background:#FBF6EC;border:1px solid #E8D6B4;border-left:3px solid var(--ocre);border-radius:0 var(--r) var(--r) 0;padding:15px;margin-bottom:14px}
.retomar.show{display:block}
.rt-txt{font-size:14px;line-height:1.5;margin-bottom:11px}
.rt-txt b{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A5B14;margin-bottom:4px}
.rt-btns .btn{margin-top:0}
.rt-btns .btn+.btn{margin-top:8px}
.aviso-espaco{display:none;background:#FCF0ED;border-left:3px solid var(--terra);border-radius:0 10px 10px 0;padding:11px 13px;font-size:13.5px;color:#7A2A1B;margin-top:12px;line-height:1.45}
.aviso-espaco.show{display:block}
#nav-salvo{color:#8FBF9E;opacity:0;transition:opacity .3s;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
#nav-salvo.on{opacity:1}
.hidden{display:none!important}
.sec-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--folha);font-weight:600;margin:24px 0 10px}

@media print{
  body{background:#fff;padding:0}
  header.top,.navbar,.no-print{display:none!important}
  .card{border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid}
  .nota-hero{background:#15271F!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .nc,.sug,.dica,.track i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <img class="brand-logo" id="logo-top" alt="Avatim">
      <div class="kicker">Auditoria de padrão de loja</div>
    </div>
    <div class="storeline" id="storeline"></div>
    <div class="regua" id="regua"></div>
  </div>
</header>

<main class="wrap">
  <!-- SETUP -->
  <section id="tela-setup">
    <div class="bloco-head">
      <div class="eyebrow">Etapa 1 de 3</div>
      <h2>Identificação da visita</h2>
      <p>Todas as lojas respondem exatamente às mesmas 49 questões. É isso que permite comparar as notas entre lojas e ao longo do tempo.</p>
    </div>
    <div class="card">
      <div class="field">
        <label for="f-loja">Loja visitada</label>
        <select id="f-loja">
          <option value="">Selecione a loja</option>
        </select>
        <div id="end-loja" class="end-loja"></div>
      </div>
      <div class="field">
        <label for="f-avaliador">Quem está aplicando</label>
        <input id="f-avaliador" type="text" placeholder="Nome de quem faz a visita">
      </div>
      <div class="field">
        <label for="f-gerente">Gerente / responsável presente</label>
        <input id="f-gerente" type="text" placeholder="Nome do responsável na loja">
      </div>
      <div class="field">
        <label for="f-data">Data da visita</label>
        <input id="f-data" type="date">
      </div>
    </div>
    <div id="retomar-box" class="retomar">
      <div class="rt-txt" id="rt-txt"></div>
      <div class="rt-btns">
        <button class="btn btn-o" onclick="retomar()">Continuar de onde parou</button>
        <button class="btn btn-s" onclick="descartarRascunho()">Descartar e começar outra</button>
      </div>
    </div>
    <button class="btn btn-p" onclick="iniciar()">Iniciar visita</button>
    <button class="btn btn-s" onclick="document.getElementById('f-import').click()">Abrir rascunho salvo</button>
    <input type="file" id="f-import" accept="application/json" class="hidden" onchange="importar(event)">
    <div id="aviso-espaco" class="aviso-espaco">Memória do aparelho cheia. Gere o relatório e salve o rascunho agora para não perder as respostas.</div>
  </section>

  <!-- CHECKLIST -->
  <section id="tela-check" class="hidden">
    <div class="bloco-head">
      <div class="eyebrow" id="b-eyebrow"></div>
      <h2 id="b-titulo"></h2>
      <p id="b-desc"></p>
    </div>
    <div class="card" id="b-itens"></div>
  </section>

  <!-- RELATÓRIO -->
  <section id="tela-rel" class="hidden"></section>
</main>

<div class="navbar hidden" id="navbar">
  <button class="nav-btn ghost" id="nav-voltar" onclick="voltarBloco()">Voltar</button>
  <div class="status"><b id="nav-nota">—</b><span id="nav-prog"></span> <span id="nav-salvo"></span></div>
  <button class="nav-btn" id="nav-avancar" onclick="avancarBloco()">Avançar</button>
</div>

 {t:"Checklist diário do gerente em dia", c:"alta", d:"Verificar os últimos 7 dias no painel. Nenhum dia em branco e nenhum preenchimento em bloco no fim da semana.",

 {t:"Caixa e sangria conforme procedimento", c:"alta", d:"Conferir o registro do dia, o valor em caixa e os comprovantes de sangria no horário previsto.",

]},
{n:"Indicadores", desc:"Números da loja no momento da visita. Anote o valor no campo de observação.", itens:[
 {t:"Atingimento da meta do mês", c:"alta", d:"Comparar o realizado acumulado com a meta proporcional aos dias corridos. Anote o percentual na observação.",
  s:"Construir plano de recuperação com meta diária ajustada, foco nas linhas de maior margem e acompanhamento diário."},

  s:"Trabalhar oferta de kits e produtos de maior valor agregado, com acompanhamento individual por vendedor."},
 {t:"PA (peças por atendimento) no padrão", c:"media", d:"Comparar com a média da rede. Anote o número na observação.",

 {t:"Taxa de conversão no padrão", c:"media", d:"Comparar com a média das lojas no mês anterior. Anote o percentual na observação.",

{n:"Segurança e SST", desc:"Itens não negociáveis. Qualquer não conformidade aqui vira prioridade máxima.", itens:[
 {t:"Extintores válidos, sinalizados e livres", c:"alta", d:"Dentro da validade, sinalização visível, acesso desobstruído e altura correta.",
  s:"Acionar a recarga ou substituição imediatamente e liberar o acesso; item impeditivo para operação segura."},
 {t:"Saída e rota de fuga desobstruídas", c:"alta", d:"Caminho livre até a saída, porta destrancada durante o expediente, sem caixa ou mercadoria no percurso.",
  s:"Desobstruir imediatamente e definir regra permanente de proibição de armazenagem na rota de fuga."},
 {t:"Iluminação de emergência funcionando", c:"alta", d:"Acionar o botão de teste do equipamento e confirmar o acendimento.",
  s:"Substituir a bateria ou o equipamento e incluir teste mensal na rotina da loja com registro."},
 {t:"Escada ou escabelo adequado para altura", c:"alta", d:"Equipamento próprio, íntegro e antiderrapante. Ninguém usa cadeira, caixa ou balcão como apoio.",
  s:"Providenciar escada adequada e proibir formalmente improviso; orientar a equipe sobre trabalho em altura."},
 {t:"Primeiros socorros e sinalização", c:"media", d:"Kit disponível, dentro da validade e sinalizado. Placas de segurança visíveis.",
  s:"Repor os itens do kit, conferir validades e afixar a sinalização de segurança nos pontos definidos."}

];

const PRAZO = {alta:2, media:7, baixa:15};
const LABEL_CRIT = {alta:"Crítico", media:"Relevante", baixa:"Básico"};

/* ===================== ESTADO ===================== */
let visita = {loja:"",avaliador:"",gerente:"",data:"",respostas:{},acoes:{}};
let blocoAtual = 0;

/* ===================== SETUP ===================== */
(function init(){
  const sel = document.getElementById('f-loja');
  LOJAS.forEach(l=>{const o=document.createElement('option');o.value=l.n;o.textContent=l.n;sel.appendChild(o)});
  sel.onchange=mostrarEndereco;
  document.getElementById('f-data').value = new Date().toISOString().slice(0,10);
  document.getElementById('logo-top').src = LOGO_LIGHT;
  renderRegua();
  const r = lerRascunho();
  if(r && r.v && r.v.loja){
    let feitas=0;
    Object.values(r.v.respostas||{}).forEach(x=>{if(x&&x.status)feitas++});
    const q=new Date(r.quando||Date.now());
    const dh=q.toLocaleDateString('pt-BR')+' às '+q.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('rt-txt').innerHTML =
      `<b>Auditoria em andamento</b>${r.v.loja} · ${feitas} de 49 itens respondidos<br>Última alteração em ${dh}`;
    document.getElementById('retomar-box').classList.add('show');
  }
})();

/* ---- salvamento automático no aparelho ---- */
const CHAVE='avatim_auditoria_rascunho';
let salvarTimer=null;
function salvar(){
  clearTimeout(salvarTimer);
  salvarTimer=setTimeout(()=>{
    try{
      localStorage.setItem(CHAVE, JSON.stringify({v:visita, bloco:blocoAtual, quando:Date.now()}));
      marcarSalvo();
    }catch(e){
      const av=document.getElementById('aviso-espaco');
      if(av) av.classList.add('show');
    }
  }, 400);
}
function marcarSalvo(){
  const el=document.getElementById('nav-salvo');
  if(!el)return;
  el.textContent='salvo';
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 1400);
}
function limparRascunho(){try{localStorage.removeItem(CHAVE)}catch(e){}}
function lerRascunho(){
  try{const r=localStorage.getItem(CHAVE);return r?JSON.parse(r):null}catch(e){return null}
}
function retomar(){
  const r=lerRascunho();
  if(!r)return;
  visita=r.v; blocoAtual=r.bloco||0;
  document.getElementById('tela-setup').classList.add('hidden');
  document.getElementById('tela-check').classList.remove('hidden');
  document.getElementById('navbar').classList.remove('hidden');
  renderStoreline(); renderBloco(); window.scrollTo(0,0);
}
function descartarRascunho(){
  if(!confirm('Descartar a auditoria em andamento? As respostas e fotos serão apagadas.'))return;
  limparRascunho();
  document.getElementById('retomar-box').classList.remove('show');
}

function dadosLoja(nome){return LOJAS.find(l=>l.n===nome)||null}
function mostrarEndereco(){
  const l=dadosLoja(document.getElementById('f-loja').value);
  const el=document.getElementById('end-loja');
  el.innerHTML = l ? `<b>${l.t==='shopping'?'Loja de shopping':'Loja de rua'}</b> · ${l.e} · ${l.f}` : '';
  el.style.display = l ? 'block' : 'none';
}

function iniciar(){
  const loja=document.getElementById('f-loja').value;
  const av=document.getElementById('f-avaliador').value.trim();
  if(!loja || !av){alert('Informe a loja e quem está aplicando a visita para começar.');return}
  const dl=dadosLoja(loja);
  visita.loja=loja;
  visita.endereco=dl?dl.e:'';
  visita.tipo=dl?dl.t:'';
  visita.avaliador=av;
  visita.gerente=document.getElementById('f-gerente').value.trim();
  visita.data=document.getElementById('f-data').value;
  document.getElementById('tela-setup').classList.add('hidden');
  document.getElementById('tela-check').classList.remove('hidden');
  document.getElementById('navbar').classList.remove('hidden');
  blocoAtual=0;
  salvar();
  renderStoreline();
  renderBloco();
}

function renderStoreline(){
  const d = visita.data ? visita.data.split('-').reverse().join('/') : '';
  document.getElementById('storeline').innerHTML =
    `<span><b>${visita.loja}</b></span><span>·</span><span>${d}</span><span>·</span><span>${visita.avaliador}</span>`
    + (visita.tipo?`<span>·</span><span>${visita.tipo==='shopping'?'shopping':'rua'}</span>`:'');
}

/* ===================== RÉGUA (assinatura) ===================== */
function renderRegua(){
  const r=document.getElementById('regua');
  r.innerHTML='';
  BLOCOS.forEach((b,i)=>{
    const st=scoreBloco(i);
    const seg=document.createElement('button');
    seg.className='seg'+(i===blocoAtual?' ativo':'')+(st.nota!==null&&st.nota<60?' alerta':'')+(st.nota!==null&&st.nota>=60&&st.nota<85?' atencao':'');
    seg.setAttribute('aria-label','Bloco '+(i+1)+': '+b.n);
    seg.innerHTML=`<span class="fill" style="height:${st.pct}%"></span><span class="num">${i+1}</span>`;
    seg.onclick=()=>{if(document.getElementById('tela-check').classList.contains('hidden'))return;blocoAtual=i;renderBloco();window.scrollTo(0,0)};
    r.appendChild(seg);
  });
}

/* ===================== CHECKLIST ===================== */
function renderBloco(){
  const b=BLOCOS[blocoAtual];
  document.getElementById('b-eyebrow').textContent=`Bloco ${blocoAtual+1} de ${BLOCOS.length}`;
  document.getElementById('b-titulo').textContent=b.n;
  document.getElementById('b-desc').textContent=b.desc;
  const cont=document.getElementById('b-itens');
  cont.innerHTML='';
  b.itens.forEach((it,j)=>{
    const id=`${blocoAtual}.${j}`;
    const r=visita.respostas[id]||{status:null,obs:'',fotos:[]};
    const el=document.createElement('div');
    el.className='item';
    el.innerHTML=`
      <div class="item-code">${blocoAtual+1}.${j+1}</div>
      <div class="item-t">${it.t}<span class="crit ${it.c}">${LABEL_CRIT[it.c]}</span></div>
      <div class="dica"><div><b>O que é conforme</b>${it.d}</div></div>
      <div class="opts">
        <button class="opt ${r.status==='C'?'on-C':''}" data-s="C">Conforme</button>
        <button class="opt ${r.status==='NC'?'on-NC':''}" data-s="NC">Não conforme<small>gera ação</small></button>
        <button class="opt ${r.status==='NA'?'on-NA':''}" data-s="NA">Não se aplica</button>
      </div>
      <div class="extras ${r.status?'show':''}">
        <textarea class="obs" placeholder="Observação: o que exatamente você viu">${r.obs||''}</textarea>
        <div class="foto-bar">
          <button class="btn-foto">＋ Anexar foto</button>
          <input type="file" accept="image/*" capture="environment" multiple class="hidden">
        </div>
        <div class="thumbs"></div>
        <div class="aviso-foto ${r.status==='NC'&&(!r.fotos||!r.fotos.length)?'show':''}">Anexe ao menos uma foto como evidência.</div>
      </div>`;
    el.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        const s=btn.dataset.s;
        const cur=visita.respostas[id]||{status:null,obs:'',fotos:[]};
        cur.status = cur.status===s ? null : s;
        visita.respostas[id]=cur;
        salvar();
        renderBloco();renderRegua();renderNav();
      };
    });
    const ta=el.querySelector('.obs');
    if(ta) ta.oninput=()=>{visita.respostas[id].obs=ta.value;salvar()};
    const inp=el.querySelector('input[type=file]');
    const bf=el.querySelector('.btn-foto');
    if(bf) bf.onclick=()=>inp.click();
    if(inp) inp.onchange=e=>addFotos(e,id);
    const th=el.querySelector('.thumbs');
    if(th) desenharThumbs(th,id,r.fotos||[]);
    cont.appendChild(el);
  });
  renderRegua();renderNav();
  document.getElementById('nav-voltar').textContent = blocoAtual===0 ? 'Início' : 'Voltar';
  document.getElementById('nav-avancar').textContent = blocoAtual===BLOCOS.length-1 ? 'Gerar relatório' : 'Avançar';
}

function desenharThumbs(cont,id,fotos){
  cont.innerHTML='';
  fotos.forEach((f,k)=>{
    const d=document.createElement('div');
    d.className='thumb';
    d.innerHTML=`<img src="${f}" alt="Evidência ${k+1}"><button aria-label="Remover foto">×</button>`;
    d.querySelector('button').onclick=()=>{visita.respostas[id].fotos.splice(k,1);salvar();renderBloco()};
    cont.appendChild(d);
  });
}

function addFotos(e,id){
  const files=[...e.target.files];
  if(!visita.respostas[id]) visita.respostas[id]={status:null,obs:'',fotos:[]};
  if(!visita.respostas[id].fotos) visita.respostas[id].fotos=[];
  let pend=files.length;
  files.forEach(file=>{
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const max=1100;
        let w=img.width,h=img.height;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        visita.respostas[id].fotos.push(cv.toDataURL('image/jpeg',.62));
        if(--pend===0){salvar();renderBloco()}
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(file);
  });
  e.target.value='';
}

/* ===================== NOTAS ===================== */
function scoreBloco(i){
  const tot=BLOCOS[i].itens.length;
  let c=0,nc=0,resp=0;
  BLOCOS[i].itens.forEach((_,j)=>{
    const r=visita.respostas[`${i}.${j}`];
    if(!r||!r.status)return;
    resp++;
    if(r.status==='C')c++;
    if(r.status==='NC')nc++;
  });
  const base=c+nc;
  return {nota: base? Math.round(c/base*100) : null, c, nc, resp, tot, pct: Math.round(resp/tot*100)};
}
function scoreGeral(){
  const notas=BLOCOS.map((_,i)=>scoreBloco(i).nota).filter(n=>n!==null);
  return notas.length? Math.round(notas.reduce((a,b)=>a+b,0)/notas.length) : null;
}
function totalRespondido(){
  let r=0,t=0;
  BLOCOS.forEach((b,i)=>{t+=b.itens.length;r+=scoreBloco(i).resp});
  return {r,t};
}
function classificar(n){
  if(n>=90)return{txt:'Padrão de excelência',cor:'#3E7A5A',bg:'#D6E7DC'};
  if(n>=75)return{txt:'Dentro do padrão',cor:'#2F6B4C',bg:'#DDEBDF'};
  if(n>=60)return{txt:'Requer atenção',cor:'#8A5B14',bg:'#F7E6C8'};
  return{txt:'Ação imediata',cor:'#8E2F1E',bg:'#F6DCD6'};
}
function corNota(n){return n>=85?'#3E7A5A':n>=60?'#C4842B':'#A8452F'}

function renderNav(){
  const g=scoreGeral(),p=totalRespondido();
  document.getElementById('nav-nota').textContent = g===null?'Nota —':'Nota '+g+'/100';
  document.getElementById('nav-prog').textContent = `${p.r} de ${p.t} itens`;
}

function avancarBloco(){
  salvar();
  if(blocoAtual<BLOCOS.length-1){blocoAtual++;renderBloco();window.scrollTo(0,0)}
  else gerarRelatorio();
}
function voltarBloco(){
  if(blocoAtual>0){blocoAtual--;renderBloco();window.scrollTo(0,0)}
  else{
    document.getElementById('tela-check').classList.add('hidden');
    document.getElementById('tela-setup').classList.remove('hidden');
    document.getElementById('navbar').classList.add('hidden');
  }
}

/* ===================== RELATÓRIO ===================== */
function listaNC(){
  const out=[];
  BLOCOS.forEach((b,i)=>b.itens.forEach((it,j)=>{
    const r=visita.respostas[`${i}.${j}`];
    if(r&&r.status==='NC') out.push({id:`${i}.${j}`,cod:`${i+1}.${j+1}`,bloco:b.n,...it,obs:r.obs,fotos:r.fotos||[]});
  }));
  return out.sort((a,b)=>({alta:0,media:1,baixa:2}[a.c]-{alta:0,media:1,baixa:2}[b.c]));
}
function prazoPadrao(crit){
  const d=new Date(visita.data||new Date());
  d.setDate(d.getDate()+PRAZO[crit]);
  return d.toISOString().slice(0,10);
}

function gerarRelatorio(){
  const g=scoreGeral();
  if(g===null){alert('Responda ao menos um item para gerar o relatório.');return}
  const ncs=listaNC(), cls=classificar(g), p=totalRespondido();
  const criticas=ncs.filter(n=>n.c==='alta').length;

  let h=`
  <div class="nota-hero">
    <img class="logo-rel" src="${LOGO_LIGHT}" alt="Avatim">
    <div class="l">Nota da visita · ${visita.loja}</div>
    <div class="n">${g}</div>
    <div class="cls" style="background:${cls.bg};color:${cls.cor}">${cls.txt}</div>
    <div class="resumo-3">
      <div><b>${ncs.length}</b><span>não conformes</span></div>
      <div><b style="color:#E8A08A">${criticas}</b><span>críticas</span></div>
      <div><b>${p.r}/${p.t}</b><span>itens avaliados</span></div>
    </div>
  </div>

  <div class="card">
    <img class="logo-print" src="${LOGO_DARK}" alt="Avatim">
    <div style="font-size:13.5px;color:var(--cinza);line-height:1.6">
      <b style="color:var(--tinta)">${visita.loja}</b> · Visita em ${(visita.data||'').split('-').reverse().join('/')}<br>
      ${visita.endereco||''}<br>
      Aplicada por ${visita.avaliador}${visita.gerente?' · Responsável na loja: '+visita.gerente:''}<br>
      Todos os blocos têm o mesmo peso na nota final.
    </div>
  </div>

  <div class="sec-title">Desempenho por bloco</div>
  <div class="card">`;

  BLOCOS.forEach((b,i)=>{
    const s=scoreBloco(i);
    h+=`<div class="barra-bloco">
      <div class="lin"><span>${i+1}. ${b.n}</span><b style="color:${s.nota===null?'#7C8079':corNota(s.nota)}">${s.nota===null?'—':s.nota}</b></div>
      <div class="track"><i style="width:${s.nota||0}%;background:${s.nota===null?'#D3D8CC':corNota(s.nota)}"></i></div>
    </div>`;
  });
  h+=`</div>`;

  if(ncs.length){
    h+=`<div class="sec-title">Não conformidades e melhorias sugeridas</div>`;
    ncs.forEach(n=>{
      h+=`<div class="nc">
        <div class="meta">${n.cod} · ${n.bloco} · ${LABEL_CRIT[n.c].toUpperCase()}</div>
        <div class="h">${n.t}</div>
        ${n.obs?`<div class="obs">"${n.obs}"</div>`:''}
        ${n.fotos.length?`<div class="thumbs">${n.fotos.map(f=>`<div class="thumb"><img src="${f}" alt="Evidência"></div>`).join('')}</div>`:''}
        <div class="sug"><b>Melhoria sugerida</b>${n.s}</div>
        <div class="acao-linha no-print">
          <div><label>Responsável</label><input type="text" value="${visita.acoes[n.id]?.resp||visita.gerente||''}" oninput="setAcao('${n.id}','resp',this.value)" placeholder="Quem executa"></div>
          <div><label>Prazo</label><input type="date" value="${visita.acoes[n.id]?.prazo||prazoPadrao(n.c)}" oninput="setAcao('${n.id}','prazo',this.value)"></div>
        </div>
      </div>`;
      if(!visita.acoes[n.id]) visita.acoes[n.id]={resp:visita.gerente||'',prazo:prazoPadrao(n.c)};
    });

    h+=`<div class="sec-title">Plano de ação consolidado</div>
    <div class="card"><table class="plano">
      <thead><tr><th>Item</th><th>O que fazer</th><th>Quem</th><th>Até</th></tr></thead><tbody id="tb-plano"></tbody>
    </table></div>`;
  } else {
    h+=`<div class="sec-title">Não conformidades</div>
    <div class="card"><div class="vazio">Nenhuma não conformidade registrada nesta visita. Reconheça o resultado com a equipe da loja.</div></div>`;
  }

  h+=`<div class="no-print" style="margin-top:22px">
    <button class="btn btn-p" onclick="window.print()">Imprimir ou salvar em PDF</button>
    <button class="btn btn-o" onclick="copiarWhats()">Copiar resumo para WhatsApp</button>
    <button class="btn btn-s" onclick="exportar()">Salvar rascunho da visita</button>
    <button class="btn btn-s" onclick="voltarChecklist()">Voltar e ajustar respostas</button>
  </div>`;

  const sec=document.getElementById('tela-rel');
  sec.innerHTML=h;
  document.getElementById('tela-check').classList.add('hidden');
  document.getElementById('navbar').classList.add('hidden');
  sec.classList.remove('hidden');
  atualizarPlano();
  window.scrollTo(0,0);
}

function setAcao(id,campo,val){
  if(!visita.acoes[id])visita.acoes[id]={resp:'',prazo:''};
  visita.acoes[id][campo]=val;
  salvar();
  atualizarPlano();
}
function atualizarPlano(){
  const tb=document.getElementById('tb-plano');
  if(!tb)return;
  tb.innerHTML=listaNC().map(n=>{
    const a=visita.acoes[n.id]||{};
    const pr=(a.prazo||prazoPadrao(n.c)).split('-').reverse().join('/');
    return `<tr>
      <td class="mono">${n.cod}</td>
      <td>${n.s}</td>
      <td>${a.resp||'—'}</td>
      <td class="mono">${pr}</td>
    </tr>`;
  }).join('');
}
function voltarChecklist(){
  document.getElementById('tela-rel').classList.add('hidden');
  document.getElementById('tela-check').classList.remove('hidden');
  document.getElementById('navbar').classList.remove('hidden');
  renderBloco();window.scrollTo(0,0);
}

function copiarWhats(){
  const g=scoreGeral(),ncs=listaNC(),cls=classificar(g);
  let t=`*AUDITORIA DE PADRÃO DE LOJA · AVATIM*\n${visita.loja} — ${(visita.data||'').split('-').reverse().join('/')}\nAplicada por: ${visita.avaliador}\n\n*NOTA GERAL: ${g}/100* (${cls.txt})\n\n*Notas por bloco*\n`;
  BLOCOS.forEach((b,i)=>{const s=scoreBloco(i);t+=`${i+1}. ${b.n}: ${s.nota===null?'—':s.nota}\n`});
  t+=`\n*Não conformidades: ${ncs.length}* (${ncs.filter(n=>n.c==='alta').length} críticas)\n`;
  ncs.slice(0,8).forEach(n=>{
    const a=visita.acoes[n.id]||{};
    t+=`\n• [${n.cod}] ${n.t}\n  → ${n.s}\n  Resp.: ${a.resp||'a definir'} | Até: ${(a.prazo||prazoPadrao(n.c)).split('-').reverse().join('/')}\n`;
  });
  if(ncs.length>8)t+=`\n(+${ncs.length-8} itens no relatório completo)\n`;
  navigator.clipboard.writeText(t).then(()=>alert('Resumo copiado. Cole no WhatsApp.'),()=>{
    prompt('Copie o texto abaixo:',t);
  });
}

function exportar(){
  const blob=new Blob([JSON.stringify(visita)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`auditoria-${visita.loja.replace(/[^\wÀ-ÿ]/g,'')}-${visita.data}.json`;
  a.click();
}
function importar(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      visita=JSON.parse(ev.target.result);
      limparRascunho();
      document.getElementById('f-loja').value=visita.loja;
      document.getElementById('f-avaliador').value=visita.avaliador;
      document.getElementById('f-gerente').value=visita.gerente||'';
      document.getElementById('f-data').value=visita.data;
      iniciar();
    }catch(err){alert('Não foi possível ler o arquivo. Selecione um rascunho salvo por esta ferramenta.')}
  };
  rd.readAsText(f);
}
</script>
