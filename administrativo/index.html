:root{
  --rot:"Nunito","Segoe UI",sans-serif;
  --tinta:#15271F; --folha:#35594A; --musgo:#6E8377;
  --papel:#EEF0EA; --carta:#FFFFFF; --ambar:#A8722C;
  --brasa:#8E3A2B; --linha:#D9DED4; --ok:#2E6B4F;
  --okfundo:#E6F1EA; --cinza:#E7EAE4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papel); color:var(--tinta);
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.5; padding-bottom:110px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--tinta)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--rot)}

/* ---------- topo ---------- */
header{background:var(--tinta);color:var(--papel);padding:16px 0 14px;position:sticky;top:0;z-index:20}
.marca{font-family:var(--rot);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#9DB3A4}
.marca b{color:#fff;font-weight:500}
.tituloTopo{display:flex;align-items:flex-end;gap:12px;margin-top:9px}
.tituloTopo h1{font-family:"Quicksand","Nunito",sans-serif;font-weight:600;font-size:24px;margin:0;line-height:1.1}
.tituloTopo .data{margin-left:auto;text-align:right;font-family:var(--rot);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9DB3A4}
.barra{height:4px;background:rgba(255,255,255,.16);margin-top:12px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:#E8C79A;transition:width .3s}
.contador{font-family:var(--rot);font-size:11px;letter-spacing:.08em;color:#9DB3A4;margin-top:6px}
.trocar{font-family:var(--rot);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9DB3A4;border:1px solid rgba(255,255,255,.25);padding:5px 10px}

/* ---------- capa ---------- */
.capa{padding:52px 0 40px;text-align:center;max-width:520px}
.capa h2{font-family:"Quicksand","Nunito",sans-serif;font-weight:600;font-size:30px;margin:22px 0 6px;line-height:1.15}
.capa p{color:var(--folha);margin:0 0 30px;font-size:15px}
.escolha{display:block;width:100%;background:var(--carta);border:1px solid var(--linha);border-left:4px solid var(--ambar);padding:20px;margin-bottom:12px;text-align:left}
.escolha strong{display:block;font-family:"Quicksand","Nunito",sans-serif;font-weight:600;font-size:23px;line-height:1.2}
.escolha span{display:block;color:var(--musgo);font-size:13.5px;margin-top:3px}
.escolha em{display:block;font-style:normal;margin-top:9px;font-family:var(--rot);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ambar)}
.gestaoLink{margin-top:24px;font-family:var(--rot);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo);border-bottom:1px solid var(--linha);padding-bottom:3px}

/* ---------- abas ---------- */
.abas{display:flex;margin:16px 0 4px;border-bottom:1px solid var(--linha)}
.abas button{flex:1;padding:11px 4px;font-family:var(--rot);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--musgo);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button.on{color:var(--tinta);border-bottom-color:var(--ambar)}

/* ---------- navegação de período ---------- */
.periodo{display:flex;align-items:center;gap:12px;margin:18px 0 10px}
.periodo .rot{font-family:"Quicksand","Nunito",sans-serif;font-weight:600;font-size:19px}
.periodo .nav{margin-left:auto;display:flex;gap:6px}
.periodo .nav button{border:1px solid var(--linha);background:#fff;padding:6px 13px;font-family:var(--rot);font-size:13px}
.periodo .hojebt{border:1px solid var(--linha);background:#fff;padding:6px 11px;font-family:var(--rot);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--folha)}

/* ---------- grade ---------- */
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linha);background:#fff}
table.grade{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
table.grade caption{
  caption-side:top;text-align:left;background:var(--tinta);color:var(--papel);
  padding:9px 12px;font-family:var(--rot);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
}
table.grade th{
  font-family:var(--rot);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:500;background:#F4F6F2;color:var(--folha);
  padding:8px 6px;border:1px solid var(--linha);text-align:center;
}
table.grade th.tarefa{text-align:left;padding-left:12px;width:38%}
table.grade th.obs{width:19%;text-align:left;padding-left:12px}
table.grade th.hj{background:var(--tinta);color:#fff}
table.grade th small{display:block;font-size:11px;letter-spacing:.02em;margin-top:2px;text-transform:none}
table.grade td{border:1px solid var(--linha);padding:0;vertical-align:middle}
table.grade td.tarefa{padding:9px 12px;line-height:1.35}
table.grade td.tarefa .dt{font-family:var(--rot);font-size:10.5px;color:var(--musgo);margin-top:3px;display:block}
table.grade td.vaz{background:var(--cinza)}
table.grade td.colhoje{background:#FAFCF9}
.cel{
  display:block;width:100%;padding:11px 4px;text-align:center;
  font-family:var(--rot);font-size:12px;
  color:var(--musgo);min-height:40px;
}
.cel:hover{background:#F4F6F2}
.cel.ok{background:var(--okfundo);color:var(--ok);font-weight:600}
.cel.na{color:var(--musgo);text-decoration:line-through}
.cel .cont{display:block;font-size:9.5px;letter-spacing:.05em;margin-top:2px;opacity:.75}
td.obs input{width:100%;border:none;background:transparent;padding:10px 11px;font-size:13px}
td.obs input:focus{outline:none;background:#FAFCF9}
td.obs input.tem{color:var(--brasa)}
.legenda{font-family:var(--rot);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--musgo);margin:9px 0 0;display:flex;flex-wrap:wrap;gap:14px}
.legenda i{font-style:normal;color:var(--folha)}
.legenda .amostra{display:inline-block;width:11px;height:11px;background:var(--cinza);border:1px solid var(--linha);vertical-align:-1px;margin-right:5px}

/* ---------- item (visão do dia) ---------- */
.grupo{margin-top:22px}
.grupo > h3{font-family:var(--rot);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--folha);margin:0 0 9px;display:flex;align-items:center;gap:9px}
.grupo > h3::after{content:"";flex:1;height:1px;background:var(--linha)}
.item{background:var(--carta);border:1px solid var(--linha);margin-bottom:8px}
.item.feito{border-color:#BCD3C4;background:#F5FAF6}
.item.naa{opacity:.62}
.linha{display:flex;align-items:flex-start;gap:12px;padding:14px}
.marca-box{flex:0 0 22px;height:22px;margin-top:1px;border:1.5px solid var(--folha);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;line-height:1}
.item.feito .marca-box{background:var(--ok);border-color:var(--ok)}
.item.naa .marca-box{background:var(--musgo);border-color:var(--musgo);font-size:13px}
.txt{flex:1;min-width:0}
.txt .t{font-size:15.5px;line-height:1.35}
.item.feito .txt .t,.item.naa .txt .t{color:var(--folha)}
.item.naa .txt .t{text-decoration:line-through}
.txt .d{font-family:var(--rot);font-size:10.5px;letter-spacing:.06em;color:var(--musgo);margin-top:4px}
.selo{display:inline-block;font-family:var(--rot);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--linha);padding:1px 5px;margin-left:6px;color:var(--musgo);vertical-align:1px}
.selo.prazo{border-color:var(--ambar);color:var(--ambar)}
.acoes{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.mini{font-family:var(--rot);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--linha);padding:4px 7px;color:var(--musgo);background:#fff}
.mini.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.painel{border-top:1px solid var(--linha);padding:12px 14px;background:#FAFBF9}
.painel textarea{width:100%;border:1px solid var(--linha);padding:9px;font-size:14.5px;resize:vertical;min-height:56px;background:#fff}
.painel .dica{font-family:var(--rot);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--musgo);margin-bottom:6px}
.sub{border-top:1px solid var(--linha);background:#FAFBF9;padding:4px 0}
.subitem{display:flex;align-items:center;gap:10px;padding:9px 14px}
.subitem + .subitem{border-top:1px solid #EDF0EA}
.subcheck{flex:0 0 18px;height:18px;border:1.5px solid var(--folha);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.subitem.feito .subcheck{background:var(--ok);border-color:var(--ok)}
.subitem .nome{flex:1;font-size:14.5px;line-height:1.3}
.subitem.feito .nome{color:var(--folha)}
.subitem .cidade{display:block;font-size:11.5px;color:var(--musgo)}
.subitem input.div{width:110px;border:1px solid var(--linha);padding:6px 7px;font-family:var(--rot);font-size:12px;background:#fff}
.subitem input.div.tem{border-color:var(--brasa);color:var(--brasa)}

/* ---------- rodapé ---------- */
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--carta);border-top:1px solid var(--linha);padding:11px 0 calc(11px + env(safe-area-inset-bottom));z-index:30}
.rodape .wrap{display:flex;gap:9px}
.btn{flex:1;padding:13px 10px;text-align:center;font-family:var(--rot);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.btn.principal{background:var(--tinta);color:#fff}
.btn.secundario{border:1px solid var(--linha);color:var(--folha);flex:0 0 auto;padding:13px 15px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(21,39,31,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .caixa{background:var(--carta);width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.modal h3{font-family:"Quicksand","Nunito",sans-serif;font-weight:600;font-size:21px;margin:0 0 4px}
.modal .sub2{color:var(--musgo);font-size:13.5px;margin:0 0 16px}

<body>
<div id="app"></div>
<script>
/* ============================================================
   ARMAZENAMENTO
   ============================================================ */
const Store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    keys(){ try { return ok ? Object.keys(localStorage) : Object.keys(mem); } catch(e){ return Object.keys(mem); } }
  };
})();

/* ============================================================
   LOJAS
   ============================================================ */
const LOJAS = [
  ['Aracruz','Centro'],['Cachoeiro de Itapemirim','Perim Center'],['Colatina','Centro'],
  ['Linhares','Spazio Nogueira Gama'],['São Mateus','Centro'],['Serra','Laranjeiras'],
  ['Vila Velha','Shopping Praia da Costa'],['Vila Velha','Shopping Vila Velha'],

];

/* ============================================================
   ROTINAS
   quando: diario | seg | ter | d01 | d05 | d10 | d26 | ultimo | cont
   opc: pode ser marcada como não se aplica
   ============================================================ */
const ROTINAS = {

    itens:[
      {id:'j1', t:'Conferência de caixa', d:'10 lojas · 1h', quando:'diario', lojas:true,

      {id:'j2', t:'Emissão de nota de saída', quando:'diario'},

      {id:'j4', t:'Admissão e demissão de novos colaboradores', quando:'diario', opc:true,
       d:'Marque não se aplica quando não houver movimentação',
       sub:['Exame médico','Treinamento de normas e procedimentos','Entrega de uniforme','Folha de ponto',
            'VT — se não quiser, declaração','VR — depois de 2 meses','Plano de saúde — depois de 2 meses',
            'Plano odontológico — depois de 2 meses']},
      {id:'j5', t:'Conferência de depósito', d:'7 lojas', quando:'seg'},
      {id:'j6', t:'Conferência boletos distribuição', quando:'seg'},
      {id:'j7', t:'Recarga e verificação VT', quando:'d26'},

      {id:'j9', t:'Recarga e verificação VR', quando:'d01'},
      {id:'jc1', t:'Pasta com documentos das lojas', quando:'cont'},

      {id:'jc3', t:'Planilha com vencimento de seguro das lojas', quando:'cont'},
      {id:'jc4', t:'Seguro de vida anual dos colaboradores', quando:'cont'},
      {id:'jc5', t:'Planilha com vencimento do certificado digital das lojas', quando:'cont'},
      {id:'jc6', t:'Planilha de recebimento de boletos', quando:'cont'},
      {id:'jc7', t:'Manuseio do F360', quando:'cont'}
    ]
  },
  katiara: {
    nome:'Katiara', area:'Operação de lojas e suprimentos',
    itens:[
      {id:'k1', t:'Acompanhar pedidos das lojas e realizar a entrada no sistema', quando:'diario'},
      {id:'k2', t:'Resolver demandas das lojas', quando:'diario'},
      {id:'k3', t:'Retorno das solicitações dos grupos de WhatsApp', quando:'diario'},
      {id:'k4', t:'Acompanhar campanhas, início e fim', d:'Paula manda a ideia, você formaliza', quando:'diario', opc:true},
      {id:'k5', t:'Dar suporte por telefone', quando:'diario'},
      {id:'k6', t:'Enviar mensagem nos grupos de informações, ciclos e comunicados', quando:'diario'},
      {id:'k7', t:'Conferir malote Linhares', d:'40 minutos', quando:'seg'},
      {id:'k8', t:'Dar baixa em produtos de uso da loja', d:'30 minutos', quando:'seg'},
      {id:'k9', t:'Pagar trocas de mercadorias', d:'1 hora', quando:'seg'},
      {id:'k10', t:'Salvar as NFs de entrada', d:'30 minutos', quando:'seg', opc:true, selo:'não tem todo dia'},
      {id:'k11', t:'Emitir NF blogueira', d:'30 minutos', quando:'seg', opc:true},
      {id:'k12', t:'Arrumação e organização das lojas', d:'Através dos grupos', quando:'ter'},
      {id:'k13', t:'Fechamento mensal da folha de pagamento e envio da documentação para a contabilidade', quando:'d01'},
      {id:'k14', t:'Salvar NF de mídia', quando:'d05'},
      {id:'k15', t:'Enviar e-mail Avatim', quando:'d05'},
      {id:'k16', t:'Enviar e-mail solicitando produtos digital influencer', quando:'d05', opc:true, selo:'quando tiver'},
      {id:'k17', t:'Pedidos de sacolas', d:'Com retorno de finalização no grupo', quando:'d10'},
      {id:'k18', t:'Enviar mensagem nos grupos pedindo relação de avarias', d:'Todas as lojas, exceto as que tiverem menos de 5 itens', quando:'d10'},
      {id:'k19', t:'Abrir chamados', quando:'d10', prazo:'finalizar até dia 15'},
      {id:'k20', t:'Emitir notas de troca', d:'Fechamento do mês', quando:'ultimo'},
      {id:'k21', t:'Pagar trocas', quando:'ultimo'},
      {id:'kc1', t:'Controle de material', d:'Tags · fita · tira olfativa', quando:'cont', selo:'mensal'},
      {id:'kc2', t:'Controle de validade', quando:'cont', selo:'mensal'},
      {id:'kc3', t:'Controle de uniforme', d:'A forma de controle precisa melhorar', quando:'cont', selo:'avulsa'}
    ]
  }
};

const ROTULO = {diario:'Todo dia', seg:'Toda segunda-feira', ter:'Toda terça-feira',
  d01:'Todo dia 01', d05:'Todo dia 05', d10:'Todo dia 10', d26:'Todo dia 26',
  ultimo:'Último dia do mês', cont:'Contínuas'};
const ORDEM = ['diario','seg','ter','d01','d05','d10','d26','ultimo'];
const MOTIVOS = [
  {id:'marcacao',   t:'Foi feito no prazo, só marquei depois', noPrazo:true},
  {id:'demanda',    t:'Volume de demanda no dia'},
  {id:'terceiro',   t:'Dependia de terceiro'},
  {id:'sistema',    t:'Sistema indisponível'},
  {id:'ausencia',   t:'Ausência ou folga'},
  {id:'prioridade', t:'Prioridade mudou'},
  {id:'outro',      t:'Outro'}
];
const rotuloMotivo = id => (MOTIVOS.find(m => m.id === id) || {}).t || '';
const MENSAIS = ['d01','d05','d10','d26','ultimo'];
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ============================================================
   DATAS
   ============================================================ */
const hoje = new Date(); hoje.setHours(12,0,0,0);
const kd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const bd = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const bdl = d => `${bd(d)}/${d.getFullYear()}`;
const ultimoDia = d => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const ehUltimo = d => d.getDate() === ultimoDia(d);
const soma = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); x.setHours(12,0,0,0); return x; };
const segundaDa = d => soma(d, d.getDay() === 0 ? -6 : 1 - d.getDay());

function venceHoje(q, d){
  const dia = d.getDate(), sem = d.getDay();
  switch(q){
    case 'diario': return sem >= 1 && sem <= 5;
    case 'seg': return sem === 1;
    case 'ter': return sem === 2;
    case 'd01': return dia === 1;
    case 'd05': return dia === 5;
    case 'd10': return dia === 10;
    case 'd26': return dia === 26;
    case 'ultimo': return ehUltimo(d);
    default: return false;
  }
}
function dataDoMes(q, ref){
  const y = ref.getFullYear(), m = ref.getMonth();
  const n = q === 'ultimo' ? ultimoDia(ref) : parseInt(q.slice(1), 10);
  const d = new Date(y, m, n); d.setHours(12,0,0,0); return d;
}

/* ============================================================
   ESTADO
   ============================================================ */
const HOJE = kd(hoje);
const SENHA = 'avatim2025';
let pessoa = null, aba = 'hoje', cache = {};
let refSemana = segundaDa(hoje), refMes = new Date(hoje);

const chave = (p,dt) => `avatim-adm:${p}:${dt}`;
function inicioDe(p){
  const k = `avatim-adm:inicio:${p}`;
  let v = Store.get(k);
  if(!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)){ v = HOJE; Store.set(k, v); }
  return v;
}
/* Uma atividade só conta como atrasada se a data já passou, ela não foi
   concluída nem marcada como não se aplica, e o dia é posterior ao início
   do uso do app — senão o histórico anterior à implantação viraria alarme. */
function atrasadas(){
  const ini = new Date(inicioDe(pessoa) + 'T12:00:00');
  const teto = soma(hoje, -60);
  let d = ini > teto ? new Date(ini) : teto;
  const fora = [];
  let guarda = 0;
  while(kd(d) < HOJE && guarda++ < 90){
    const dt = kd(d), reg = dia(dt);
    doDia(pessoa, d).forEach(i => {
      const r = reg[i.id] || {};
      if(r.st !== 'ok' && r.st !== 'na') fora.push({dt, dObj:new Date(d), i});
    });
    d = soma(d, 1);
  }
  return fora.reverse();
}
function dia(dt){
  if(!cache[dt]){
    try { cache[dt] = JSON.parse(Store.get(chave(pessoa,dt))) || {}; } catch(e){ cache[dt] = {}; }
  }
  return cache[dt];
}
/* Quantos dias úteis se passaram entre a data prevista e a conclusão.
   Zero quer dizer concluída no próprio dia (ou antes). */
function atrasoDias(dtPrev, emISO){
  if(!emISO) return 0;
  let feito;
  try { feito = kd(new Date(emISO)); } catch(e){ return 0; }
  if(!feito || feito <= dtPrev) return 0;
  let n = 0, d = soma(new Date(dtPrev + 'T12:00:00'), 1), g = 0;
  while(kd(d) <= feito && g++ < 400){
    if(d.getDay() >= 1 && d.getDay() <= 5) n++;
    d = soma(d, 1);
  }
  return n;
}
function seloAtraso(n){ return n === 1 ? '1 dia depois' : n + ' dias depois'; }
function leDia(p, dt){
  try { return JSON.parse(Store.get(chave(p,dt))) || {}; } catch(e){ return {}; }
}
function inicioLido(p){
  const v = Store.get(`avatim-adm:inicio:${p}`);
  return (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
}
function reg(dt,id){ const d = dia(dt); if(!d[id]) d[id] = {st:null, obs:'', sub:{}, lojas:{}}; return d[id]; }
function grava(dt){ Store.set(chave(pessoa,dt), JSON.stringify(dia(dt))); }

const doDia = (p,d) => ROTINAS[p].itens.filter(i => i.quando !== 'cont' && venceHoje(i.quando, d));
const contInuas = p => ROTINAS[p].itens.filter(i => i.quando === 'cont');

function progresso(){
  const l = doDia(pessoa, hoje), d = dia(HOJE);
  const total = l.filter(i => (d[i.id]||{}).st !== 'na').length;
  const feitos = l.filter(i => (d[i.id]||{}).st === 'ok').length;
  return {feitos, total, pc: total ? Math.round(feitos/total*100) : 100};
}

/* ============================================================
   AÇÕES
   ============================================================ */
const achaItem = id => ROTINAS[pessoa].itens.find(i => i.id === id);

function carimba(r){
  if(r.st === 'ok'){ if(!r.em) r.em = new Date().toISOString(); }
  else delete r.em;
}
function cicla(dt, id, ev){
  if(ev) ev.stopPropagation();
  const r = reg(dt,id), it = achaItem(id);
  if(r.st === null){
    if(dt < HOJE && dt >= inicioDe(pessoa)){ pedeMotivo(dt, id); return; }
    r.st = 'ok';
  }
  else if(r.st === 'ok') r.st = it.opc ? 'na' : null;
  else r.st = null;
  carimba(r);
  if(r.st !== 'ok'){ delete r.motivo; delete r.motivoTexto; delete r.noPrazo; }
  grava(dt); render();
}

let escolhaMotivo = null;
function pedeMotivo(dt, id, ev){
  if(ev) ev.stopPropagation();
  const it = achaItem(id), r = reg(dt, id);
  const dObj = new Date(dt + 'T12:00:00');
  const dep = atrasoDias(dt, new Date().toISOString());
  escolhaMotivo = r.motivo || null;
  modal(`<h3>Conclusão em atraso</h3>
    <p class="sub2">${esc(it.t)}<br>Previsto para ${bdl(dObj)}, ${DIAS[dObj.getDay()]}${dep ? ` · ${seloAtraso(dep)}` : ''}</p>
    <p class="rotcampo">Motivo do atraso</p>
    <div class="chips" id="mtv">${MOTIVOS.map(m =>
      `<button class="chip${escolhaMotivo === m.id ? ' on' : ''}" data-m="${m.id}"
        onclick="marcaMotivo('${m.id}')">${m.t}</button>`).join('')}</div>
    <p class="rotcampo">Detalhe <span>opcional</span></p>
    <textarea id="mtxt" class="cmp" placeholder="O que aconteceu">${esc(r.motivoTexto || '')}</textarea>
    <div id="mtvErro"></div>
    <div style="display:flex;gap:9px">
      <button class="btn principal" onclick="salvaMotivo('${dt}','${id}')">Concluir</button>
      <button class="btn secundario" onclick="fecha()">Cancelar</button></div>`);
}
function marcaMotivo(id){
  escolhaMotivo = id;
  const cx = document.querySelectorAll('#mtv .chip');
  for(let i = 0; i < cx.length; i++) cx[i].className = 'chip' + (cx[i].getAttribute('data-m') === id ? ' on' : '');
  const e = document.getElementById('mtvErro'); if(e) e.innerHTML = '';
}
function salvaMotivo(dt, id){
  if(!escolhaMotivo){
    const e = document.getElementById('mtvErro');
    if(e) e.innerHTML = '<p class="erro">Escolha um motivo para concluir.</p>';
    return;
  }
  const r = reg(dt, id);
  const t = ((document.getElementById('mtxt') || {}).value || '').trim();
  const m = MOTIVOS.find(x => x.id === escolhaMotivo) || {};
  r.st = 'ok';
  r.em = new Date().toISOString();
  r.motivo = escolhaMotivo;
  r.motivoTexto = t;
  r.noPrazo = !!m.noPrazo;
  grava(dt); fecha(); render();
}
function alterna(id){
  const r = reg(HOJE,id);
  r.st = r.st === 'ok' ? null : 'ok';
  carimba(r); grava(HOJE); render();
}
function naoAplica(id, ev){ ev.stopPropagation(); const r = reg(HOJE,id); r.st = r.st === 'na' ? null : 'na'; carimba(r); grava(HOJE); render(); }
function abreObs(id, ev){ ev.stopPropagation(); const r = reg(HOJE,id); r.aberto = !r.aberto; grava(HOJE); render(); }
function gravaObs(dt, id, v){ reg(dt,id).obs = v; grava(dt); }
function gravaObsCel(dt, id, v, el){ reg(dt,id).obs = v; grava(dt); if(el) el.classList.toggle('tem', !!v.trim()); }

function alternaSub(id, k, ev){
  ev.stopPropagation();
  const r = reg(HOJE,id), it = achaItem(id);
  r.sub[k] = !r.sub[k];
  const todas = it.sub.every((_,n) => r.sub[n]);
  if(todas) r.st = 'ok'; else if(r.st === 'ok') r.st = null;
  carimba(r); grava(HOJE); render();
}
function alternaLoja(id, k, ev){
  ev.stopPropagation();
  const r = reg(HOJE,id);
  if(!r.lojas[k]) r.lojas[k] = {ok:false, div:''};
  r.lojas[k].ok = !r.lojas[k].ok;
  const todas = LOJAS.every((_,n) => (r.lojas[n]||{}).ok);
  if(todas) r.st = 'ok'; else if(r.st === 'ok') r.st = null;
  carimba(r); grava(HOJE); render();
}
function gravaDiv(id, k, v){
  const r = reg(HOJE,id);
  if(!r.lojas[k]) r.lojas[k] = {ok:false, div:''};
  r.lojas[k].div = v; grava(HOJE);
  const el = document.querySelector(`[data-div="${id}:${k}"]`);
  if(el) el.classList.toggle('tem', !!v.trim());
}

function escolhe(p){ pessoa = p; inicioDe(p); aba = 'hoje'; cache = {}; refSemana = segundaDa(hoje); refMes = new Date(hoje); render(); }
function voltar(){ pessoa = null; render(); }
function trocaAba(a){ aba = a; render(); }
function andaSemana(n){ refSemana = soma(refSemana, n*7); render(); }
function semanaAtual(){ refSemana = segundaDa(hoje); render(); }
function andaMes(n){ const d = new Date(refMes); d.setDate(1); d.setMonth(d.getMonth()+n); d.setHours(12,0,0,0); refMes = d; render(); }
function mesAtual(){ refMes = new Date(hoje); render(); }
function limpar(){
  if(!confirm('Isso apaga tudo o que foi marcado hoje. Continuar?')) return;
  cache[HOJE] = {}; grava(HOJE); render();
}

/* ============================================================
   RESUMO
   ============================================================ */
function textoResumo(){
  const p = progresso(), d = dia(HOJE), L = [];
  L.push('*AVATIM · ADMINISTRATIVO*');
  L.push(`${ROTINAS[pessoa].nome} — ${bdl(hoje)}, ${DIAS[hoje.getDay()]}`);
  L.push(`Concluído: ${p.feitos} de ${p.total}`);
  L.push('');
  let ult = null;
  doDia(pessoa, hoje).forEach(i => {
    if(i.quando !== ult){ L.push(`— ${ROTULO[i.quando]} —`); ult = i.quando; }
    const r = d[i.id] || {};
    L.push(`${r.st === 'ok' ? '[OK]' : r.st === 'na' ? '[N/A]' : '[  ]'} ${i.t}`);
    if(i.lojas){
      const marc = Object.values(r.lojas||{}).filter(v => v.ok).length;
      L.push(`      ${marc} de ${LOJAS.length} lojas conferidas`);
      Object.entries(r.lojas||{}).forEach(([k,v]) => {
        if(v.div && v.div.trim()) L.push(`      ! ${LOJAS[k][0]} (${LOJAS[k][1]}): ${v.div.trim()}`);
      });
    }
    if(i.sub && r.st !== 'na'){
      const f = i.sub.filter((_,k) => (r.sub||{})[k]).length;
      if(f) L.push(`      ${f} de ${i.sub.length} etapas concluídas`);
    }
    if(r.obs && r.obs.trim()) L.push(`      obs: ${r.obs.trim()}`);
  });
  const regular = [];
  {
    const ini = new Date(inicioDe(pessoa) + 'T12:00:00');
    const teto = soma(hoje, -60);
    let x = ini > teto ? new Date(ini) : teto, g = 0;
    while(kd(x) < HOJE && g++ < 90){
      const dtx = kd(x), rx = dia(dtx);
      doDia(pessoa, x).forEach(i => {
        const y = rx[i.id] || {};
        if(y.st === 'ok' && y.em && kd(new Date(y.em)) === HOJE)
          regular.push(`${i.t} (previsto ${bd(x)}, ${y.noPrazo ? 'feita no prazo, marcada depois' : seloAtraso(atrasoDias(dtx, y.em))})`
            + (y.motivo && !y.noPrazo ? `\n      motivo: ${rotuloMotivo(y.motivo)}${y.motivoTexto ? ' — ' + y.motivoTexto : ''}` : ''));
      });
      x = soma(x, 1);
    }
  }
  if(regular.length){
    L.push(''); L.push('— Regularizadas hoje —');
    regular.forEach(t => L.push(`[OK] ${t}`));
  }
  const feitasCont = contInuas(pessoa).filter(i => (d[i.id]||{}).st === 'ok');
  if(feitasCont.length){
    L.push(''); L.push('— Contínuas concluídas hoje —');
    feitasCont.forEach(i => L.push(`[OK] ${i.t}`));
  }
  return L.join('\n');
}
function abreResumo(){
  modal(`<h3>Resumo do dia</h3><p class="sub2">Copie e cole no grupo da gestão.</p>
    <pre id="rsm">${esc(textoResumo())}</pre>
    <div style="display:flex;gap:9px">
      <button class="btn principal" onclick="copiar()">Copiar texto</button>
      <button class="btn secundario" onclick="fecha()">Fechar</button></div>`);
}
function copiar(){
  const t = document.getElementById('rsm').textContent;
  const fim = () => { const b = document.querySelector('.modal .principal'); if(b) b.textContent = 'Copiado'; };
  const manual = () => {
    const a = document.createElement('textarea'); a.value = t;
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); fim(); } catch(e){ alert('Selecione o texto e copie manualmente.'); }
    document.body.removeChild(a);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(fim).catch(manual);
  else manual();
}

function pedeSenha(){
  modal(`<h3>Painel da gestão</h3><p class="sub2">Acompanhamento do que foi cumprido.</p>
    <input type="password" id="sn" placeholder="Senha" autocomplete="off"><div id="er"></div>
    <div style="display:flex;gap:9px">
      <button class="btn principal" onclick="entraGestao()">Entrar</button>
      <button class="btn secundario" onclick="fecha()">Fechar</button></div>`);
  setTimeout(() => { const s = document.getElementById('sn');
    if(s){ s.focus(); s.addEventListener('keydown', e => { if(e.key === 'Enter') entraGestao(); }); } }, 60);
}
function entraGestao(){
  if((document.getElementById('sn')||{}).value !== SENHA){
    document.getElementById('er').innerHTML = '<p class="erro">Senha incorreta.</p>'; return;
  }
  mostraGestao();
}
function mostraGestao(qtd){
  qtd = qtd || 8;
  /* Monta os dias para trás, incluindo só os que têm alguma tarefa prevista
     para alguém — assim um sábado com tarefa de dia 05 continua aparecendo. */
  const pessoas = Object.keys(ROTINAS);
  const datas = [];
  let d = new Date(hoje), guarda = 0;
  while(datas.length < qtd && guarda++ < 70){
    if(pessoas.some(p => doDia(p, d).length)) datas.push(new Date(d));
    d = soma(d, -1);
  }

  const blocos = datas.map(dObj => {
    const dt = kd(dObj), passado = dt < HOJE;
    const linhas = pessoas.map(p => {
      const ini = inicioLido(p);
      if(ini && dt < ini) return '';                 /* antes de começar a usar */
      const lista = doDia(p, dObj);
      if(!lista.length) return '';
      const r = leDia(p, dt);
      const total = lista.filter(i => (r[i.id]||{}).st !== 'na').length;
      const feitos = lista.filter(i => (r[i.id]||{}).st === 'ok').length;
      const pend = lista.filter(i => !(r[i.id]||{}).st).map(i => i.t);
      const tarde = [];
      const notas = [];
      lista.forEach(i => {
        const x = r[i.id] || {};
        const dep = (x.st === 'ok' && !x.noPrazo) ? atrasoDias(dt, x.em) : 0;
        if(dep) tarde.push(`${i.t} — concluída ${seloAtraso(dep)}. ${x.motivo ? rotuloMotivo(x.motivo) : 'Sem motivo informado'}${x.motivoTexto ? ': ' + x.motivoTexto : ''}`);
        else if(x.noPrazo) tarde.push(`${i.t} — feita no prazo, marcada depois`);
        Object.entries(x.lojas||{}).forEach(([n,v]) => {
          if(v.div && v.div.trim()) notas.push(`${LOJAS[n][0]} (${LOJAS[n][1]}): ${v.div.trim()}`);
        });
        if(x.obs && x.obs.trim()) notas.push(`${i.t}: ${x.obs.trim()}`);
      });
      const pc = total ? Math.round(feitos/total*100) : 100;
      const semRegistro = !Object.keys(r).length;
      return `<div class="pl">
        <div class="plcab">
          <strong>${ROTINAS[p].nome}</strong>
          <span class="pc ${pc === 100 ? 'cheio' : pc >= 50 ? 'meio' : pc === 0 ? 'zero' : ''}">${feitos}/${total}</span>
        </div>
        ${semRegistro ? `<p class="nada">${passado ? 'Não marcou nada neste dia.' : 'Ainda não abriu o checklist hoje.'}</p>` : ''}
        ${(pend.length || tarde.length || notas.length) ? `<ul>
          ${pend.map(x => `<li class="${passado ? 'atr' : ''}">◻ ${esc(x)}${passado ? ' — atrasada' : ''}</li>`).join('')}
          ${tarde.map(x => `<li class="tarde">◷ ${esc(x)}</li>`).join('')}
          ${notas.map(x => `<li><b>!</b> ${esc(x)}</li>`).join('')}</ul>` : ''}
      </div>`;
    }).join('');
    if(!linhas.trim()) return '';
    return `<div class="dia">
      <div class="cab"><span class="qd">${bdl(dObj)} · ${DIAS[dObj.getDay()]}</span>
      ${dt === HOJE ? '<span class="hojetag">hoje</span>' : ''}</div>
      ${linhas}</div>`;
  }).join('');

  let forasDoPrazo = 0;
  datas.forEach(dObj => {
    const dt = kd(dObj);
    pessoas.forEach(p => {
      const r = leDia(p, dt);
      doDia(p, dObj).forEach(i => {
        const x = r[i.id] || {};
        if(x.st === 'ok' && !x.noPrazo && atrasoDias(dt, x.em)) forasDoPrazo++;
      });
    });
  });

  modal(`<h3>Painel da gestão</h3>
    <p class="sub2">Últimos ${datas.length} dias com tarefas previstas${forasDoPrazo ? ` · ${forasDoPrazo} concluída${forasDoPrazo === 1 ? '' : 's'} fora do prazo` : ''}.</p>
    <div class="aviso">Mostra o que foi marcado <b>neste computador</b>. O que a outra colaboradora marcar na máquina dela não aparece aqui até ligarmos o app a um banco de dados.</div>
    ${blocos || '<p class="vazio">Nenhum dia com tarefas no período.</p>'}
    <div style="display:flex;gap:9px;margin-top:14px">
      <button class="btn secundario" style="flex:1" onclick="mostraGestao(${qtd + 8})">Ver mais dias</button>
      <button class="btn secundario" style="flex:1" onclick="fecha()">Fechar</button></div>`);
}

/* ============================================================
   VISÃO: GRADE DA SEMANA
   ============================================================ */
function gradeSemana(){
  const dias = [0,1,2,3,4].map(n => soma(refSemana, n));
  const fim = dias[4];
  const linhas = ROTINAS[pessoa].itens.filter(i => ['diario','seg','ter'].indexOf(i.quando) >= 0);
  const cabec = dias.map(d => `<th class="${kd(d) === HOJE ? 'hj' : ''}">${ABREV[d.getDay()]}<small>${bd(d)}</small></th>`).join('');

  const corpo = linhas.map((i,n) => {
    const cels = dias.map(d => {
      const dt = kd(d), aplica = venceHoje(i.quando, d);
      if(!aplica) return '<td class="vaz"></td>';
      const r = dia(dt)[i.id] || {};
      const atr = !r.st && dt < HOJE && dt >= inicioDe(pessoa);
      const dep = (r.st === 'ok' && !r.noPrazo) ? atrasoDias(dt, r.em) : 0;
      const marca = r.st === 'ok' ? 'Concluído' : r.st === 'na' ? 'N/A' : atr ? 'Atrasada' : '';
      let extra = '';
      if(dep) extra = `<span class="cont">+${dep}d</span>`;
      else if(r.noPrazo) extra = '<span class="cont">marcado depois</span>';
      else if(i.lojas){
        const c = Object.values(r.lojas||{}).filter(v => v.ok).length;
        if(c) extra = `<span class="cont">${c}/${LOJAS.length} lojas</span>`;
      }
      const dica = r.em ? ` title="Concluída em ${bdl(new Date(r.em))}${dep ? ', ' + seloAtraso(dep) : ', no prazo'}${r.motivo ? ' — ' + rotuloMotivo(r.motivo) + (r.motivoTexto ? ': ' + r.motivoTexto : '') : ''}"` : '';
      return `<td class="${dt === HOJE ? 'colhoje' : ''}">
        <span class="cel ${r.st === 'ok' ? (dep ? 'tarde' : 'ok') : r.st === 'na' ? 'na' : atr ? 'atr' : ''}"${dica}
              onclick="cicla('${dt}','${i.id}',event)">${marca || '·'}${extra}</span></td>`;
    }).join('');
    const rObs = dia(kd(refSemana))[i.id] || {};
    return `<tr>
      <td class="tarefa">${n+1}. ${i.t}${i.selo ? `<span class="selo">${i.selo}</span>` : ''}
        ${i.d ? `<span class="dt">${i.d}</span>` : ''}</td>
      ${cels}
      <td class="obs"><input value="${esc(rObs.obs || '')}" placeholder="—"
        class="${(rObs.obs||'').trim() ? 'tem' : ''}"
        oninput="gravaObsCel('${kd(refSemana)}','${i.id}',this.value,this)"></td></tr>`;
  }).join('');

  return `
  <div class="periodo">
    <span class="rot">${bd(refSemana)} a ${bd(fim)}</span>
    <button class="hojebt" onclick="semanaAtual()">Semana atual</button>
    <span class="nav"><button onclick="andaSemana(-1)">‹</button><button onclick="andaSemana(1)">›</button></span>
  </div>
  <div class="rolagem"><table class="grade">
    <caption>Atividades da semana</caption>
    <thead><tr><th class="tarefa">Atividade</th>${cabec}<th class="obs">Observações</th></tr></thead>
    <tbody>${corpo}</tbody>
  </table></div>
  <p class="legenda">
    <i>Clique na célula para marcar</i>
    <span><i>Concluído</i> = feito</span>
    <span><i>N/A</i> = não se aplica</span>
    <span><span class="amostra"></span>não previsto para o dia</span>
    <span style="color:var(--brasa)"><i style="color:var(--brasa)">Atrasada</i> = venceu e não foi concluída</span>
    <span style="color:#8A5A17"><i style="color:#8A5A17">+2d</i> = concluída dias depois do previsto</span>
  </p>`;
}

              onclick="cicla('${dt}','${i.id}',event)">${r.st === 'ok' ? 'Concluído' : r.st === 'na' ? 'N/A' : atr ? 'Atrasada' : (passou ? 'em aberto' : '·')}${dep ? `<span class="cont">${seloAtraso(dep)}</span>` : ''}</span></td>

  </div>
  <div class="rolagem"><table class="grade">
    <caption>Atividades mensais</caption>
    <thead><tr><th class="tarefa">Data</th><th class="tarefa">Atividade</th><th>Situação</th><th class="obs">Observações</th></tr></thead>
    <tbody>${corpo}</tbody>
  </table></div>
  <p class="legenda"><i>Clique na coluna Situação para marcar</i></p>`;
}

/* ============================================================
   VISÃO: DIA
   ============================================================ */
function linhaItem(i){
  const r = dia(HOJE)[i.id] || {};
  const cls = r.st === 'ok' ? ' feito' : r.st === 'na' ? ' naa' : '';
  const mk = r.st === 'ok' ? '✓' : r.st === 'na' ? '–' : '';
  let sub = '';
  if(i.lojas && r.st !== 'na'){
    sub = `<div class="sub">${LOJAS.map((L,k) => {
      const lj = (r.lojas||{})[k] || {ok:false, div:''};
      return `<div class="subitem${lj.ok ? ' feito' : ''}">
        <div class="subcheck" onclick="alternaLoja('${i.id}',${k},event)">${lj.ok ? '✓' : ''}</div>
        <div class="nome" onclick="alternaLoja('${i.id}',${k},event)">${L[0]}<span class="cidade">${L[1]}</span></div>
        <input class="div${lj.div ? ' tem' : ''}" data-div="${i.id}:${k}" placeholder="divergência"
          value="${esc(lj.div)}" oninput="gravaDiv('${i.id}',${k},this.value)" onclick="event.stopPropagation()"></div>`;
    }).join('')}</div>`;
  }
  if(i.sub && r.st !== 'na'){
    sub = `<div class="sub">${i.sub.map((s,k) => {
      const f = (r.sub||{})[k];
      return `<div class="subitem${f ? ' feito' : ''}" onclick="alternaSub('${i.id}',${k},event)">
        <div class="subcheck">${f ? '✓' : ''}</div><div class="nome">${s}</div></div>`;
    }).join('')}</div>`;
  }
  return `<div class="item${cls}">
    <div class="linha" onclick="alterna('${i.id}')">
      <div class="marca-box">${mk}</div>
      <div class="txt"><div class="t">${i.t}${i.selo ? `<span class="selo">${i.selo}</span>` : ''}${i.prazo ? `<span class="selo prazo">${i.prazo}</span>` : ''}</div>
        ${i.d ? `<div class="d">${i.d}</div>` : ''}</div>
      <div class="acoes">
        <button class="mini${r.aberto ? ' on' : ''}" onclick="abreObs('${i.id}',event)">Obs</button>
        ${i.opc ? `<button class="mini${r.st === 'na' ? ' on' : ''}" onclick="naoAplica('${i.id}',event)">N/A</button>` : ''}
      </div></div>
    ${sub}
    ${r.aberto ? `<div class="painel"><div class="dica">${i.obs || 'Observação'}</div>
      <textarea placeholder="O que aconteceu, o que ficou pendente…"
        oninput="gravaObs('${HOJE}','${i.id}',this.value)">${esc(r.obs || '')}</textarea></div>` : ''}
  </div>`;
}
function listaHoje(){
  const itens = doDia(pessoa, hoje);
  if(!itens.length) return '<p class="vazio">Nenhuma tarefa programada para hoje.</p>';
  return ORDEM.filter(q => itens.some(i => i.quando === q)).map(q =>
    `<div class="grupo"><h3>${ROTULO[q]}</h3>${itens.filter(i => i.quando === q).map(linhaItem).join('')}</div>`).join('');
}
function listaCont(){
  return `<div class="grupo"><h3>Estruturação e controles</h3>
    <p style="color:var(--musgo);font-size:13.5px;margin:-2px 0 11px">Não entram na contagem do dia. Marque conforme forem sendo feitas.</p>
    ${contInuas(pessoa).map(linhaItem).join('')}</div>`;
}

   RENDER
   ============================================================ */
function capa(){
  return `<div class="wrap"><div class="capa">
    <div class="marca" style="color:var(--folha)"><b style="color:var(--tinta)">Avatim</b> · Administrativo</div>
    <h2>Checklist do dia</h2>
    <p>${bdl(hoje)} · ${DIAS[hoje.getDay()]}</p>
    ${Object.entries(ROTINAS).map(([k,v]) => {
      const n = ROTINAS[k].itens.filter(i => i.quando !== 'cont' && venceHoje(i.quando, hoje)).length;
      return `<button class="escolha" onclick="escolhe('${k}')">
        <strong>${v.nome}</strong><span>${v.area}</span>
        <em>${n} ${n === 1 ? 'tarefa hoje' : 'tarefas hoje'}</em></button>`;
    }).join('')}
    <button class="gestaoLink" onclick="pedeSenha()">Painel da gestão</button>
  </div></div>`;
}
function avisoAtraso(){
  const l = atrasadas();
  if(!l.length) return '';
  const mostra = l.slice(0, 6);
  return `<div class="alerta">
    <h4><span class="sino">!</span>${l.length} ${l.length === 1 ? 'atividade atrasada' : 'atividades atrasadas'}</h4>
    <p class="exp">Venceram em dias anteriores e não foram concluídas nem marcadas como não se aplica.</p>
    <ul>${mostra.map(a => `<li>
      <span class="quando">${bd(a.dObj)} ${ABREV[a.dObj.getDay()]}</span>
      <span class="oq">${a.i.t}</span>
      <button class="marcar" onclick="cicla('${a.dt}','${a.i.id}',event)">Concluir</button>
    </li>`).join('')}</ul>
    ${l.length > mostra.length ? `<p class="mais">E mais ${l.length - mostra.length} nas abas Semana e Mês.</p>` : ''}
  </div>`;
}

function tela(){
  const p = progresso();
  const conteudo = aba === 'hoje' ? listaHoje() : aba === 'semana' ? gradeSemana() : aba === 'mes' ? tabelaMes() : listaCont();
  return `
  <header><div class="wrap">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="marca"><b>Avatim</b> · Administrativo</div>
      <button class="trocar" style="margin-left:auto" onclick="voltar()">Trocar</button></div>
    <div class="tituloTopo"><h1>${ROTINAS[pessoa].nome}</h1>
      <div class="data">${bdl(hoje)}<br>${DIAS[hoje.getDay()]}</div></div>
    <div class="barra"><i style="width:${p.pc}%"></i></div>
    <div class="contador">${p.feitos} de ${p.total} concluídas hoje · ${p.pc}%</div>
  </div></header>
  <div class="wrap">
    <div class="abas">
      <button class="${aba === 'hoje' ? 'on' : ''}" onclick="trocaAba('hoje')">Hoje</button>
      <button class="${aba === 'semana' ? 'on' : ''}" onclick="trocaAba('semana')">Semana</button>
      <button class="${aba === 'mes' ? 'on' : ''}" onclick="trocaAba('mes')">Mês</button>
      <button class="${aba === 'cont' ? 'on' : ''}" onclick="trocaAba('cont')">Contínuas</button>
    </div>
    ${avisoAtraso()}
    ${conteudo}
  </div>
  <div class="rodape"><div class="wrap">
    <button class="btn principal" onclick="abreResumo()">Resumo do dia</button>
    <button class="btn secundario" onclick="window.print()">Imprimir</button>
    <button class="btn secundario" onclick="pedeSenha()">Gestão</button>
    <button class="btn secundario" onclick="limpar()">Zerar</button>
  </div></div>`;
}
function render(){ document.getElementById('app').innerHTML = pessoa ? tela() : capa(); }
render();
</script>
</body>
</html>
